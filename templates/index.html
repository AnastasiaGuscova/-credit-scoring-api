
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Scoring</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #202b40;
        }

        .container {
            width: 100%;
            max-width: 490px;
            padding: 34px;
            background: #fff;
            border: 1px solid #e8ebf1;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(25, 40, 70, 0.07);
        }

        .header {
            margin-bottom: 28px;
        }

        .header h1 {
            margin: 0 0 9px;
            font-size: 23px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            margin: 0;
            color: #8993a5;
            font-size: 13px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #46536a;
        }

        input, select {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            border: 1px solid #e1e6ef;
            border-radius: 8px;
            outline: none;
            background: #fafbfc;
            color: #26334a;
            font-size: 14px;
            transition: 0.2s;
        }

        input:focus, select:focus {
            border-color: #4263eb;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(66, 99, 235, 0.08);
        }

        button {
            width: 100%;
            height: 48px;
            margin-top: 7px;
            border: none;
            border-radius: 8px;
            background: #3157d5;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #2447bd;
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .result {
            display: none;
            margin-top: 22px;
            padding: 17px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.7;
        }

        .result.approve {
            background: #edf8f2;
            border: 1px solid #c9ead7;
            color: #18784b;
        }

        .result.decline {
            background: #fff1f1;
            border: 1px solid #f1d1d1;
            color: #b83b42;
        }

        .result.error {
            background: #fff1f1;
            border: 1px solid #f1d1d1;
            color: #b83b42;
        }

        .result h3 {
            margin: 0 0 8px;
            font-size: 16px;
        }

        .result ul {
            padding-left: 20px;
            margin-bottom: 0;
        }

        @media (max-width: 520px) {
            .container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Кредитный скоринг</h1>
        <p>Заполните параметры заявки для оценки кредитного риска</p>
    </div>

    <form id="creditForm">

        <div class="form-group">
            <label>Сумма кредита, ₽</label>
            <input type="number" name="credit_amount" value="5000" min="1" required>
        </div>

        <div class="form-group">
            <label>Срок кредита, месяцев</label>
            <input type="number" name="duration" value="24" min="1" required>
        </div>

        <div class="form-group">
            <label>Возраст заёмщика</label>
            <input type="number" name="age" value="30" min="18" max="120" required>
        </div>

        <div class="form-group">
            <label>Цель кредита</label>
            <select name="purpose">
                <option value="radio/tv">Бытовая техника</option>
                <option value="car">Автомобиль</option>
                <option value="furniture/equipment">Мебель</option>
                <option value="business">Бизнес</option>
            </select>
        </div>

        <div class="form-group">
            <label>Стаж работы</label>
            <select name="employment">
                <option value="1<=X<4">От 1 до 4 лет</option>
                <option value=">=7">Более 7 лет</option>
                <option value="<1">Менее 1 года</option>
            </select>
        </div>

        <button type="submit" id="submitBtn">
            Рассчитать скоринг
        </button>

    </form>

    <div id="resultBox" class="result">
        <h3 id="decisionText"></h3>
        <div id="llmExplanation"></div>
    </div>

</div>

<script>
    document.getElementById('creditForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const button = document.getElementById('submitBtn');
        const box = document.getElementById('resultBox');

        button.disabled = true;
        button.textContent = 'Выполняется оценка...';
        box.style.display = 'none';

        try {
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            data.credit_amount = parseFloat(data.credit_amount);
            data.duration = parseInt(data.duration);
            data.age = parseInt(data.age);

            const fullData = {
                ...data,
                checking_status: "<0",
                credit_history: "critical/other existing credit",
                savings_status: "<100",
                installment_commitment: 4,
                personal_status: "male single",
                other_parties: "none",
                residence_since: 2,
                property_magnitude: "real estate",
                other_payment_plans: "none",
                housing: "own",
                existing_credits: 1,
                job: "skilled",
                num_dependents: 1,
                own_telephone: "yes",
                foreign_worker: "yes"
            };

            const response = await fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ features: fullData })
            });

            const result = await response.json();

            if (!response.ok || result.status === 'error') {
                throw new Error(result.message || 'Ошибка обработки заявки');
            }

            const approved = result.decision === 'approve';

            box.className = 'result ' + (approved ? 'approve' : 'decline');
            box.style.display = 'block';

            document.getElementById('decisionText').textContent =
                approved ? 'Кредит одобрен' : 'Кредит отклонён';

            let html = `<b>Вероятность дефолта:</b> ${(result.probability * 100).toFixed(1)}%`;

            html += '<br><br><b>Основные факторы:</b><ul>';

            (result.top_factors || []).forEach(f => {
                const direction = f.direction === 'increases_risk'
                    ? 'Повышает риск'
                    : 'Снижает риск';

                const item = document.createElement('li');
                item.textContent = `${f.feature} — ${direction} (сила: ${Math.abs(f.impact)})`;
                document.getElementById('llmExplanation').appendChild(item);
            });

            document.getElementById('llmExplanation').innerHTML = html + '</ul>';

        } catch (error) {
            box.className = 'result error';
            box.style.display = 'block';
            document.getElementById('decisionText').textContent = 'Ошибка обработки';
            document.getElementById('llmExplanation').textContent = error.message;

        } finally {
            button.disabled = false;
            button.textContent = 'Рассчитать скоринг';
        }
    });
</script>

</body>
</html>
